name: V2 isolated format repair
on:
  push:
    branches:
      - refactor/v2-clean-mvp-foundation
    paths:
      - docs/engineering/V2_FORMAT_REQUEST.md

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/v2-clean-mvp-foundation
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install black
      - name: Format only V2 refactor additions
        run: |
          black custom_components/ev_smart_charging/v2 tests/v2 \
            custom_components/ev_smart_charging/__init__.py \
            custom_components/ev_smart_charging/config_flow.py \
            custom_components/ev_smart_charging/sensor.py \
            tests/test_config_flow.py
      - name: Commit formatting to isolated branch
        run: |
          if git diff --quiet; then
            echo "All V2 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ev_smart_charging/v2 tests/v2 \
            custom_components/ev_smart_charging/__init__.py \
            custom_components/ev_smart_charging/config_flow.py \
            custom_components/ev_smart_charging/sensor.py \
            tests/test_config_flow.py
          git commit -m "style(v2): run Black on isolated refactor"
          git push origin HEAD:refs/heads/refactor/v2-clean-mvp-foundation
