name: Temporary format persisted cost model
on:
  push:
    branches: [fix/local-bootstrap-lifecycle]
    paths: [.github/workflows/temporary-black-persist.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-bootstrap-lifecycle
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==26.10.1
      - run: |
          black custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/costs.py tests/controller/test_actual_costs.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/costs.py tests/controller/test_actual_costs.py
            git commit -m "style: Black-format persisted actual-cost lifecycle"
            git push origin HEAD:fix/local-bootstrap-lifecycle
          fi
