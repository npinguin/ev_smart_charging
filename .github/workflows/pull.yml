name: Pull actions

on:
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
      - uses: "actions/checkout@v7"
      - name: Compile every production and test Python module
        run: |
          python3 -m compileall -q custom_components/ev_smart_charging tests

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: brands

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.x"
      - run: python3 -m pip install black
      - run: black --check --diff .

  legacy_regression_smoke:
    runs-on: "ubuntu-latest"
    name: Legacy Local behavior smoke (3.11)
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.11"
      - name: Install same test dependencies
        run: python3 -m pip install -r requirements_test311.txt
      - name: Verify unchanged legacy behavior
        run: |
          pytest -q -n 0 --timeout=45 --asyncio-mode=auto \
            -p no:sugar \
            tests/coordinator/test_coordinator_keep_on2.py::test_coordinator_keep_on_schedule \
            tests/test_init.py::test_setup_unload_and_reload_entry

  upstream_baseline_triage:
    runs-on: "ubuntu-latest"
    name: Upstream baseline compatibility (3.11)
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.11"
      - name: Install same test dependencies as feature
        run: python3 -m pip install -r requirements_test311.txt
      - name: Check original upstream baseline with same HA dependencies
        run: |
          git checkout cb6cc76972ecf3e7098f26d273a9ebade9c7f062
          pytest -q -n 0 --timeout=45 --asyncio-mode=auto \
            -p no:sugar \
            tests/coordinator/test_coordinator_keep_on2.py::test_coordinator_keep_on_schedule \
            tests/test_init.py::test_setup_unload_and_reload_entry

  controller_tests:
    runs-on: "ubuntu-latest"
    name: Controller behavioral regression (3.11)
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python3 -m pip install -r requirements_test311.txt
      - name: Run focused controller tests
        run: |
          pytest -q -n 0 --timeout=45 --asyncio-mode=auto \
            -p no:sugar tests/controller

  tests:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.11"
            requirements: "requirements_test311.txt"
          - python-version: "3.12"
            requirements: "requirements_test312.txt"
          - python-version: "3.13"
            requirements: "requirements_test313.txt"
          - python-version: "3.14"
            requirements: "requirements_test314.txt"
    name: Run tests
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v7"
      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: python3 -m pip install -r ${{ matrix.requirements }}
      - name: Run tests
        run: |
          pytest \
            -qq \
            --timeout=45 \
            --durations=10 \
            -n auto \
            --asyncio-mode=auto \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=90 \
            --cov custom_components.ev_smart_charging \
            -o console_output_style=count \
            -p no:sugar \
            tests
      # External Codecov reporting is optional. pytest coverage remains a
      # required >=90% gate on every Python test matrix version.
      - name: "Upload coverage to Codecov (optional)"
        if: ${{ matrix.python-version == '3.14' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: false