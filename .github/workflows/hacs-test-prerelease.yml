name: HACS guarded Mobility Light drop-in prerelease

# Explicitly operator-requested guarded Local-capable test packaging only.
# Never publish on ordinary code pushes: one release request file gates this.
on:
  push:
    branches:
      - architecture/vehicle-charger-assignment-v1
    paths:
      - docs/controller/HACS_TEST_RELEASE_REQUEST.md

permissions:
  contents: read
  # The called Python matrix uses GitHub OIDC for best-effort Codecov reporting.
  id-token: write

jobs:
  full_ci_gate:
    name: Require full Gate A regression
    uses: ./.github/workflows/pull.yml

  publish_test_prerelease:
    name: Publish isolated HACS test prerelease
    needs: full_ci_gate
    # Operator explicitly requested another HACS build. P0 stays OPEN:
    # publish only a Local-capable quarantine build; no Coordinated actuation.
    if: ${{ github.ref == 'refs/heads/architecture/vehicle-charger-assignment-v1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 2.6.0-rc.10
    steps:
      - uses: actions/checkout@v7

      - name: Verify exact tested package and version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = json.loads(Path("custom_components/ev_smart_charging/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          const = Path("custom_components/ev_smart_charging/const.py").read_text()
          assert manifest["version"] == version, "Mismatch: manifest version"
          assert f'VERSION = "{version}"' in const, "Mismatch: const.py version"
          assert not hacs.get("zip_release", False), "HACS must install from source tree"
          assert "filename" not in hacs, "HACS must not require a release asset"
          assert Path("custom_components/ev_smart_charging/services.yaml").exists()
          safety = Path("custom_components/ev_smart_charging/controller/safety.py").read_text()
          assert "COORDINATED_ACTUATION_ENABLED = False" in safety, (
              "P0: release must not enable coordinated physical Start/Stop"
          )
          runtime = Path("custom_components/ev_smart_charging/controller/runtime.py").read_text()
          assert "CONTROLLER_POLL_SECONDS = 5" in runtime, "Expected guarded 5-second sampler"
          assert "async_track_time_change(" in runtime, "Expected HA native sampling timer"
          assert Path("tests/controller/test_unified_poll_lifecycle.py").exists(), (
              "No mode/reload/feedback regression guard"
          )
          diagnostics = Path("custom_components/ev_smart_charging/diagnostics.py").read_text()
          assert "async_get_config_entry_diagnostics" in diagnostics
          assert "async_get_device_diagnostics" in diagnostics
          assert Path("tests/controller/test_diagnostics.py").exists(), (
              "Diagnostics regressions required in the exact-head release"
          )
          native = Path("custom_components/ev_smart_charging/coordinator.py").read_text()
          assert "source = self.charging_state_entity_id or self.charger_switch.entity_id" in native, (
              "Missing bounded Local native-switch readback retry"
          )
          assert Path("tests/controller/test_local_native_execution.py").exists(), (
              "Missing Local native Start/Stop/retry regression"
          )
          sensor_code = Path("custom_components/ev_smart_charging/sensor.py").read_text()
          assert "self._async_source_state_changed" in sensor_code
          assert "lambda _event: self.async_write_ha_state()" not in sensor_code, (
              "P0: worker-thread native source callback cannot ship"
          )
          config_code = Path("custom_components/ev_smart_charging/config_flow.py").read_text()
          assert '"coordinated_disabled"' in config_code, (
              "P0: new Coordinated membership must not detach Local scheduling"
          )
          assert Path("tests/controller/test_thread_safety.py").exists()
          assert Path("tests/controller/test_coordinated_admission_hold.py").exists()
          # Real HA lifecycle and four-config-entry drop-in evidence.
          assert "async_step_link_chargers" in config_code
          assert "linked_chargers" in config_code
          selects = Path("custom_components/ev_smart_charging/select.py").read_text()
          assert "ChargerControllerLinkSelect" in selects
          assert "VehicleAssignmentSelect" in selects
          assert Path("tests/controller/test_vehicle_config.py").exists()
          assert Path("tests/controller/test_ha_managed_bootstrap.py").exists()
          assert Path("custom_components/ev_smart_charging/vehicle_sensors.py").exists()
          assert Path("docs/controller/RC9_DROPIN_TEST.md").exists()
          assert Path("docs/controller/RC10_WHOLE_INSTALLATION_DIAGNOSTICS.md").exists()
          assert 'SCHEMA_VERSION = "1.2"' in diagnostics
          assert '"multi_day_planning": multi_day' in diagnostics
          assert '"vehicle_profiles": vehicles' in diagnostics
          assert '"diagnostic_scope": "entire_ev_smart_charging_installation"' in diagnostics
          assert Path("tests/controller/test_multi_day_forecast.py").exists()
          assert "planning_horizon_days" in config_code
          assert "async_add_executor_job(" in runtime
          print(f"Verified HACS integration v{version} from commit {os.environ['GITHUB_SHA']}")
          PY

      - name: Package optional manual recovery ZIP (HACS uses source tree)
        run: |
          mkdir -p "$RUNNER_TEMP/hacs-dist"
          (
            cd custom_components/ev_smart_charging
            zip -q -r "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" . -x '*/__pycache__/*' '*.pyc'
          )
          unzip -Z -1 "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" | grep -q '^manifest.json$'
          unzip -Z -1 "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" | grep -q '^services.yaml$'
          unzip -t "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip"

      - name: Retain the manually usable ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: evsc-guarded-rc10-diagnostics-manual-zip
          path: ${{ runner.temp }}/hacs-dist/ev_smart_charging.zip
          if-no-files-found: error

      - name: Create prerelease without changing main or stable versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Test release $tag already exists; never overwrite a tested artifact"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          # Publish tag once. The existing default-branch publish workflow
          # attaches the optional ZIP after the release event; never race its
          # release asset upload. HACS already uses the source tree.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EV Smart Charging $tag — guarded Mobility Light drop-in test" \
            --notes "GUARDED EVSC COMPLETE-INSTALLATION DIAGNOSTICS TEST RELEASE. V2.6.0-rc.10 extends rc.9 without altering four original Local Charger config entries, EVSE Start/Stop or HA identity. Controller Device / Config Entry Download Diagnostics is now one privacy-safe support export for ALL configured Charger entries (including unlinked), Vehicle profiles/SoC source quality/assignments, complete 1..14-day multi-day plan status, bounded per-Vehicle/day kWh and indicative EUR, source/meter coverage, lifecycle and explicit readiness blockers. It exposes no raw personal names, HA entity IDs, Charger ConfigEntry IDs or full quarter schedules and does not issue charging commands or trigger replans. Legacy per-Charger diagnostics remain available. PHYSICAL COORDINATED ACTUATION IS STILL DISABLED under open P0 #5; this diagnostics release does not authorize physical Local-to-Coordinated migration. Continue existing Local EVSE control; back up HA and retain rc.9 for rollback. Source commit $GITHUB_SHA; Draft PR #6. Do not merge upstream or main."
