name: HACS V1-parity / V2 end-to-end RC17 field-test prerelease

# Explicitly operator-requested guarded Local-capable test packaging only.
# Never publish on ordinary code pushes: one release request file gates this.
on:
  push:
    branches:
      - feature/rc17-consolidated-v2
    paths:
      - docs/controller/HACS_TEST_RELEASE_REQUEST.md

permissions:
  contents: read
  # The called Python matrix uses GitHub OIDC for best-effort Codecov reporting.
  id-token: write

jobs:
  full_ci_gate:
    name: Require full Gate A regression
    uses: ./.github/workflows/pull.yml

  publish_test_prerelease:
    name: Publish isolated HACS test prerelease
    needs: full_ci_gate
    # Operator explicitly requested another HACS build. P0 stays OPEN:
    # publish only a Local-capable quarantine build; no Coordinated actuation.
    if: ${{ github.ref == 'refs/heads/feature/rc17-consolidated-v2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: 2.6.0-rc.17
    steps:
      - uses: actions/checkout@v7

      - name: Verify exact tested package and version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = json.loads(Path("custom_components/ev_smart_charging/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          const = Path("custom_components/ev_smart_charging/const.py").read_text()
          assert manifest["version"] == version, "Mismatch: manifest version"
          assert f'VERSION = "{version}"' in const, "Mismatch: const.py version"
          assert not hacs.get("zip_release", False), "HACS must install from source tree"
          assert "filename" not in hacs, "HACS must not require a release asset"
          assert Path("custom_components/ev_smart_charging/services.yaml").exists()
          safety = Path("custom_components/ev_smart_charging/controller/safety.py").read_text()
          assert "COORDINATED_ACTUATION_ENABLED = False" in safety, (
              "P0: release must not enable coordinated physical Start/Stop"
          )
          runtime = Path("custom_components/ev_smart_charging/controller/runtime.py").read_text()
          assert "CONTROLLER_POLL_SECONDS = 5" in runtime, "Expected guarded 5-second sampler"
          assert "async_track_time_change(" in runtime, "Expected HA native sampling timer"
          assert Path("tests/controller/test_unified_poll_lifecycle.py").exists(), (
              "No mode/reload/feedback regression guard"
          )
          diagnostics = Path("custom_components/ev_smart_charging/diagnostics.py").read_text()
          assert "async_get_config_entry_diagnostics" in diagnostics
          assert "async_get_device_diagnostics" in diagnostics
          assert Path("tests/controller/test_diagnostics.py").exists(), (
              "Diagnostics regressions required in the exact-head release"
          )
          native = Path("custom_components/ev_smart_charging/coordinator.py").read_text()
          assert "last_retry = getattr(self, \"_last_local_retry_at\", None)" in native, (
              "Missing bounded Local native-switch readback retry"
          )
          assert "charging_readback(charging_state.state)" in native, (
              "Do not retry when actual charging-state sensor confirms charging"
          )
          assert "self.hass.states.get(self.charger_switch.entity_id) is None" in native, (
              "Missing original HA ConfigEntryNotReady startup source validation"
          )
          assert Path("tests/controller/test_local_native_execution.py").exists(), (
              "Missing Local native Start/Stop/retry regression"
          )
          sensor_code = Path("custom_components/ev_smart_charging/sensor.py").read_text()
          assert "self._async_source_state_changed" in sensor_code
          assert "lambda _event: self.async_write_ha_state()" not in sensor_code, (
              "P0: worker-thread native source callback cannot ship"
          )
          config_code = Path("custom_components/ev_smart_charging/config_flow.py").read_text()
          assert '"coordinated_disabled"' in config_code, (
              "P0: new Coordinated membership must not detach Local scheduling"
          )
          assert Path("tests/controller/test_thread_safety.py").exists()
          assert Path("tests/controller/test_coordinated_admission_hold.py").exists()
          # Real HA lifecycle and four-config-entry drop-in evidence.
          assert "async_step_link_chargers" in config_code
          assert "linked_chargers" in config_code
          selects = Path("custom_components/ev_smart_charging/select.py").read_text()
          # V1 Local surface must remain exactly upstream; V2 owns new
          # controller and vehicle link entities on separate Config Entries.
          assert "selects.append(ChargerControllerLinkSelect(" not in selects
          assert "selects.append(VehicleAssignmentSelect(" not in selects
          assert "DATETIME" not in Path("custom_components/ev_smart_charging/const.py").read_text().split("PLATFORMS =", 1)[1].split("]", 1)[0]
          assert Path("tests/v2/test_local_upstream_surface.py").is_file()
          assert Path("tests/v2/test_legacy_surface_registry.py").is_file()
          assert Path("tests/v2/test_migration.py").is_file()
          assert Path("tests/controller/test_vehicle_config.py").exists()
          assert Path("tests/controller/test_ha_managed_bootstrap.py").exists()
          assert Path("custom_components/ev_smart_charging/vehicle_sensors.py").exists()
          assert Path("docs/controller/RC9_DROPIN_TEST.md").exists()
          assert Path("docs/controller/RC10_WHOLE_INSTALLATION_DIAGNOSTICS.md").exists()
          assert 'SCHEMA_VERSION = "1.3"' in diagnostics
          observation = Path("custom_components/ev_smart_charging/charger_observation.py").read_text()
          assert "def observe_charger(" in observation
          assert "availability_enable" in observation and "power_relay" in observation
          assert '"physical_observation": observation' in diagnostics
          assert '"reconciliation_status": (' in diagnostics
          # The original Local Config Flow no longer owns V2 fields.
          v2_flow = Path("custom_components/ev_smart_charging/v2/flow.py").read_text()
          assert "control_semantics" in v2_flow
          assert "physical_enabled" in v2_flow
          assert "V2_PHYSICAL_EXECUTION_AVAILABLE = True" in safety
          assert "CONTROLLER_CONTROL_DISABLED" in Path(
              "custom_components/ev_smart_charging/v2/execution.py"
          ).read_text()
          assert "LEGACY_LOCAL_OWNS_PHYSICAL_CHARGER" in Path(
              "custom_components/ev_smart_charging/v2/execution.py"
          ).read_text()
          assert Path("docs/controller/RC11_CONTROL_SEMANTICS_AND_RUNTIME.md").exists()
          assert '"multi_day_planning": multi_day' in diagnostics
          assert '"vehicle_profiles": vehicles' in diagnostics
          assert '"diagnostic_scope": "entire_ev_smart_charging_installation"' in diagnostics
          assert Path("tests/controller/test_multi_day_forecast.py").exists()
          assert "planning_horizon_days" in config_code
          # New V2 is separate and exclusively scoped: 1 Controller = 1 planner.
          for required in (
            "custom_components/ev_smart_charging/v2/model.py",
            "custom_components/ev_smart_charging/v2/catalog.py",
            "custom_components/ev_smart_charging/v2/flow.py",
            "custom_components/ev_smart_charging/v2/runtime.py",
            "custom_components/ev_smart_charging/v2/planning.py",
            "custom_components/ev_smart_charging/v2/entities.py",
            "tests/v2/test_exclusive_relationships.py",
            "tests/v2/test_v2_planner.py",
            "tests/v2/test_ha_v2_flows.py",
            "tests/v2/test_ha_v2_runtime.py",
          ):
            assert Path(required).is_file(), f"Missing V2 MVP gate: {required}"
          assert "get_v2_charge_plan" in Path("custom_components/ev_smart_charging/__init__.py").read_text()
          # New V2 Ready By, exclusive ownership and native adapter regression gates.
          for required in (
            "custom_components/ev_smart_charging/v2/ready_schedule.py",
            "custom_components/ev_smart_charging/v2/ownership.py",
            "custom_components/ev_smart_charging/v2/execution.py",
            "custom_components/ev_smart_charging/v2/ports.py",
            "custom_components/ev_smart_charging/v2/adapters/home_assistant.py",
            "tests/v2/test_ready_schedule.py",
            "tests/v2/test_ownership.py",
            "tests/v2/test_execution.py",
            "tests/v2/test_group_admission.py",
            "tests/v2/test_generic_boundaries.py",
          ):
            assert Path(required).is_file(), f"Missing mandatory V2 calendar/ownership gate: {required}"
          assert "COORDINATED_ACTUATION_ENABLED = False" in safety, (
            "Do not deliver unqualified field physical actuation"
          )

          # RC15 event storm, storage and source feedback regression gates.
          for required in (
            "tests/controller/test_stability_budget.py",
            "tests/controller/test_local_event_coalescing.py",
            "tests/controller/test_legacy_next_day_ready.py",
            "tests/v2/test_source_feedback.py",
          ):
            assert Path(required).is_file(), f"Stability test missing: {required}"
          local = Path("custom_components/ev_smart_charging/coordinator.py").read_text()
          registry = Path("custom_components/ev_smart_charging/v2/catalog.py").read_text()
          assert "async def _drain_source_updates" in local
          drain = local.split("async def _drain_source_updates", 1)[1].split(
            "async def update_sensors", 1
          )[0]
          # A zero-duration yield batches same-tick HA events without
          # parking a task. Only positive-delay sleeps were the hang bug.
          assert "await asyncio.sleep(" not in drain.replace(
            "await asyncio.sleep(0)", ""
          ), "A timed HA-tracked source task can hang async_block_till_done"
          assert "_source_timer_fired" in local
          assert "_source_refresh_task" in local
          assert "MAX_EFFECTIVE_PRICE_QUARTERS" in runtime
          assert "async_delay_save(" in runtime
          assert "async_flush_costs" in runtime
          # The old daily Local Ready By must keep tomorrow 08:00 working.
          old_select = Path("custom_components/ev_smart_charging/select.py").read_text()
          old_helper = Path("custom_components/ev_smart_charging/helpers/coordinator.py").read_text()
          assert "get_ready_quarter_utc" in old_helper
          assert "absolute.clear()" in old_select
          assert "self.ev_soc_before_last_charging = -1" in local
          assert "eager_start=False" in local, "Local source event storm must coalesce"
          assert "_check_source_feedback" in registry
          assert "COORDINATED_ACTUATION_ENABLED = False" in safety
          assert "async_add_executor_job(" in runtime
          # RC17 functionality cannot be declared complete based on old
          # rc.16 smoke alone. Every promised capability has a source test.
          init_code = Path("custom_components/ev_smart_charging/__init__.py").read_text()
          assert "_ensure_controller(" not in init_code
          for file in (
            "custom_components/ev_smart_charging/v2/manual_connection.py",
            "custom_components/ev_smart_charging/v2/session_progress.py",
            "custom_components/ev_smart_charging/v2/soc_estimation.py",
            "custom_components/ev_smart_charging/v2/source_discovery.py",
            "custom_components/ev_smart_charging/v2/group_facts.py",
            "custom_components/ev_smart_charging/v2/tariffs.py",
            "custom_components/ev_smart_charging/v2/budget.py",
            "custom_components/ev_smart_charging/v2/intermediate_conversion.py",
            "tests/v2/test_rc17_smart_plug_and_explicit_demand.py",
            "tests/v2/test_rc17_soc_compensation.py",
            "tests/v2/test_rc17_actual_cost_reporting.py",
            "tests/v2/test_rc17_intermediate_conversion.py",
            "tests/v2/test_rc17_intermediate_ha_flows.py",
          ):
            assert Path(file).is_file(), f"RC17 missing source/acceptance: {file}"
          assert "Connected (manual)" in Path(
              "custom_components/ev_smart_charging/switch.py"
          ).read_text()
          assert "CostBudgetGuard" in Path(
              "custom_components/ev_smart_charging/v2/runtime.py"
          ).read_text()
          assert "actual_cost_today" in Path(
              "custom_components/ev_smart_charging/v2/group_facts.py"
          ).read_text()
          print(f"Verified HACS integration v{version} from commit {os.environ['GITHUB_SHA']}")
          PY

      - name: Package optional manual recovery ZIP (HACS uses source tree)
        run: |
          mkdir -p "$RUNNER_TEMP/hacs-dist"
          (
            cd custom_components/ev_smart_charging
            zip -q -r "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" . -x '*/__pycache__/*' '*.pyc'
          )
          unzip -Z -1 "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" | grep -q '^manifest.json$'
          unzip -Z -1 "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip" | grep -q '^services.yaml$'
          unzip -t "$RUNNER_TEMP/hacs-dist/ev_smart_charging.zip"

      - name: Retain the manually usable ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: evsc-rc17-v1-parity-v2-native-manual-zip
          path: ${{ runner.temp }}/hacs-dist/ev_smart_charging.zip
          if-no-files-found: error

      - name: Create prerelease without changing main or stable versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Test release $tag already exists; never overwrite a tested artifact"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          # Publish tag once. The existing default-branch publish workflow
          # attaches the optional ZIP after the release event; never race its
          # release asset upload. HACS already uses the source tree.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EV Smart Charging $tag — consolidated V1/V2 field test" \
            --notes "EVSC $tag — V2 CONFIGURATION AND PHYSICAL FIELD TEST ONLY. Immutable tested SHA: $GITHUB_SHA. Original upstream Local V1 remains unchanged including next-day 08:00 and native Local actuation. V2 now provides independent Vehicle/Charger/Controller Config Entries, device-assisted source suggestions, searchable native HA selectors, manual smart-plug Connected Yes/No, real on/off + feedback, no-SoC grid-kWh/duration planning, daily/weekly/once Ready By, timestamped OEM/manual/meter-compensated SoC with explicit quality, persisted charging-session progress, measured session cost and conservative cost ceilings, multi-day Controller totals and whole-house power peak shedding. Old intermediate Controller and Vehicle profiles can be reviewed and imported into independent V2 Config Entries without mutating V1; physical control starts disabled. You MUST separately retire historical intermediate entries after verifying their profiles and Charger links. Original Local and V2 must never concurrently control the same physical device. Previous Local Coordinated remains quarantined; V2 physical control is deliberate per-Controller opt-in, one Charger at a time with native readback. Real Peblar/Wallbox/smart-plug OEM field acceptance is NOT proven by CI and P0 #5 remains open until physical evidence exists. Test with a complete Home Assistant backup, start read-only, verify data quality/pricing, only then disable a given original Local writer and enable that V2 Controller. This is not stable; do not assume that HA-only budget limits can cut off charging if the HA host itself hangs or loses power. Restore the HA backup plus v2.6.0-rc.16 for rollback."
