name: Temporary Phase 1 Black formatter
on:
  push:
    branches: [fix/local-bootstrap-lifecycle]
    paths: [.github/workflows/temporary-format-phase1.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-bootstrap-lifecycle
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==26.10.1
      - name: Format precisely current implementation files
        run: |
          black custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/individual.py custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/sensor.py tests/controller/test_live_sources_and_peak.py tests/controller/test_individual_projection.py tests/controller/test_joint_optimizer.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/individual.py custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/sensor.py tests/controller/test_live_sources_and_peak.py tests/controller/test_individual_projection.py tests/controller/test_joint_optimizer.py
            git commit -m "style: Black-format Phase 1 feature implementation"
            git push origin HEAD:fix/local-bootstrap-lifecycle
          fi
