name: Temporary final Phase 1 Black format
on:
  push:
    branches: [fix/local-bootstrap-lifecycle]
    paths: [.github/workflows/tmp-final-phase1-style.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-bootstrap-lifecycle
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==26.10.1
      - run: |
          black custom_components/ev_smart_charging/config_flow.py custom_components/ev_smart_charging/sensor.py custom_components/ev_smart_charging/controller/individual.py custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/costs.py custom_components/ev_smart_charging/controller/mixed_optimizer.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/controller/local_projection.py tests/test_config_flow.py tests/controller/test_individual_projection.py tests/controller/test_live_sources_and_peak.py tests/controller/test_planner_admission.py tests/controller/test_actual_costs.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_smart_charging/config_flow.py custom_components/ev_smart_charging/sensor.py custom_components/ev_smart_charging/controller/individual.py custom_components/ev_smart_charging/controller/runtime.py custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/costs.py custom_components/ev_smart_charging/controller/mixed_optimizer.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/controller/local_projection.py tests/test_config_flow.py tests/controller/test_individual_projection.py tests/controller/test_live_sources_and_peak.py tests/controller/test_planner_admission.py tests/controller/test_actual_costs.py
            git commit -m "style: strict Black format of complete energy-native controller changes"
            git push origin HEAD:fix/local-bootstrap-lifecycle
          fi
