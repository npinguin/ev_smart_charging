name: V2 operational one-shot Black normalization
on:
  push:
    branches:
      - feature/v2-operational-mvp-gates
    paths:
      - docs/engineering/V2_FORMAT_REQUEST.md

permissions:
  contents: write

jobs:
  black_format:
    name: Format isolated MVP source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/v2-operational-mvp-gates
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned formatter
        run: python -m pip install "black==25.1.0"
      - name: Normalize only operational V2 edits
        run: |
          black custom_components/ev_smart_charging/v2 tests/v2             custom_components/ev_smart_charging/config_flow.py             custom_components/ev_smart_charging/__init__.py             custom_components/ev_smart_charging/sensor.py
      - name: Commit Black normalization on WIP branch
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ev_smart_charging/v2 tests/v2             custom_components/ev_smart_charging/config_flow.py             custom_components/ev_smart_charging/__init__.py             custom_components/ev_smart_charging/sensor.py
          git commit -m "style(v2): normalize complete operational MVP with Black"
          git push origin HEAD:refs/heads/feature/v2-operational-mvp-gates
