name: Temporary feature completion Black
on:
  push:
    branches: [fix/local-bootstrap-lifecycle]
    paths: [.github/workflows/tmp-black-feature-completion.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-bootstrap-lifecycle
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==26.10.1
      - name: Format all actual feature completion changes
        run: |
          black custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/controller/mixed_optimizer.py custom_components/ev_smart_charging/controller/monitor.py custom_components/ev_smart_charging/controller/local_projection.py custom_components/ev_smart_charging/controller/runtime.py tests/controller/test_planner_admission.py tests/controller/test_joint_optimizer.py tests/controller/test_mixed_optimizer.py tests/controller/test_monitor.py tests/controller/test_local_projection.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_smart_charging/controller/planner.py custom_components/ev_smart_charging/controller/optimizer.py custom_components/ev_smart_charging/controller/mixed_optimizer.py custom_components/ev_smart_charging/controller/monitor.py custom_components/ev_smart_charging/controller/local_projection.py custom_components/ev_smart_charging/controller/runtime.py tests/controller/test_planner_admission.py tests/controller/test_joint_optimizer.py tests/controller/test_mixed_optimizer.py tests/controller/test_monitor.py tests/controller/test_local_projection.py
            git commit -m "style: Black format mixed optimizer and Local/Coordinated aggregation"
            git push origin HEAD:fix/local-bootstrap-lifecycle
          fi
