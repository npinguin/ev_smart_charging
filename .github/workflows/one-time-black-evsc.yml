name: Temporary Black formatting of new controller changes
on:
  push:
    branches:
      - fix/local-bootstrap-lifecycle
    paths:
      - .github/workflows/one-time-black-evsc.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-bootstrap-lifecycle
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==26.10.1
      - name: Apply deterministic format to changed files only
        run: |
          black custom_components/ev_smart_charging/controller/runtime.py tests/controller/test_live_sources_and_peak.py tests/controller/test_drop_in_four_local.py
          git diff --check
          if ! git diff --quiet -- custom_components/ev_smart_charging/controller/runtime.py tests/controller/test_live_sources_and_peak.py tests/controller/test_drop_in_four_local.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ev_smart_charging/controller/runtime.py tests/controller/test_live_sources_and_peak.py tests/controller/test_drop_in_four_local.py
            git commit -m "style: Black-format fresh controller sources and regressions"
            git push origin HEAD:fix/local-bootstrap-lifecycle
          fi
